<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Order desk · Team</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/portal/portal.css">
<style>
.wrap{max-width:1400px;margin:0 auto;padding:18px 22px 60px;display:flex;flex-direction:column;gap:16px}
@media(max-width:560px){.wrap{padding:12px}}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{padding:9px 14px;border-radius:10px;background:var(--raise);color:var(--sub);text-decoration:none;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
nav.tabs a.on{background:var(--y);color:#0b0d14}
nav.tabs a .n{background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:12px}
.next{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.next a{display:block;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--sub);font-size:14px}
.next a b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
.next a.hot{border-color:var(--bad)}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:200px;display:flex;flex-direction:column;gap:10px}
.col h3{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);margin:0}
.oc{display:block;background:var(--raise);border-radius:12px;padding:12px;text-decoration:none;color:var(--sub);font-size:13px;border:1px solid transparent}
.oc:hover{border-color:#3a4052}
.oc b{color:var(--ink);font-size:14.5px;display:block}
.oc .fl{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.oc .chip{font-size:11.5px;padding:1px 8px}
.empty-col{font-size:13px;color:var(--mut);padding:8px}
.fg{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
.fg .w2{grid-column:span 2}.fg .w4{grid-column:1/-1}
@media(max-width:900px){.fg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.fg{grid-template-columns:minmax(0,1fr)}.fg .w2{grid-column:auto}}
textarea{min-height:120px;padding:10px 12px;line-height:1.45}
textarea.big{min-height:260px}
.pk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pk label{display:block;padding:10px 12px;border-radius:10px;background:var(--raise);border:1px solid var(--line);cursor:pointer;font-size:13px;color:var(--sub)}
.pk label b{display:block;color:var(--ink);font-size:15px}
.pk input{display:none}.pk label.on{border-color:var(--y);background:rgba(253,185,19,.08)}
@media(max-width:620px){.pk{grid-template-columns:1fr}}
.ohead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{padding:6px 10px;border-radius:8px;background:var(--raise);font-size:12.5px;color:var(--mut);font-weight:600}
.steps span.on{background:var(--y);color:#0b0d14}.steps span.done{color:var(--ok)}
.og{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media(max-width:1000px){.og{grid-template-columns:minmax(0,1fr)}}
.og>div{display:flex;flex-direction:column;gap:16px}
.ln{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--soft);font-size:14px;color:var(--sub)}
.ln:last-child{border-bottom:0}
.ln .tx{flex:1;min-width:0;overflow-wrap:anywhere}.ln .tx b{color:var(--ink)}
.ln .ac{display:flex;gap:6px;flex-wrap:wrap;flex:none}
@media(max-width:620px){.ln{flex-direction:column}}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kv div{background:var(--raise);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--mut)}
.kv div b{display:block;font-size:18px;color:var(--ink)}
.kv div b.g{color:var(--ok)}.kv div b.r{color:var(--bad)}
@media(max-width:620px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
.msg{white-space:pre-wrap;background:var(--raise);border-radius:10px;padding:12px;font-size:14px;color:var(--ink);line-height:1.5}
ul.p{margin:0;padding-left:18px;color:var(--sub);font-size:14px}ul.p li{margin:3px 0}
.tl{font-size:13px;color:var(--mut);max-height:320px;overflow:auto}.tl div{padding:6px 0;border-bottom:1px solid var(--soft)}.tl b{color:var(--sub)}
.verdict{font-size:20px;font-weight:700;text-transform:capitalize}
.sc{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.sc div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;color:var(--mut)}
.sc div b{display:block;font-size:24px;color:var(--ink)}
.code{font:700 22px ui-monospace,Menlo,monospace;letter-spacing:.12em;background:var(--raise);padding:10px 14px;border-radius:10px;color:var(--y);display:inline-block}
.cv{max-height:560px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.bu{max-width:82%;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.5;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.bu.c{align-self:flex-start;background:var(--raise);border-top-left-radius:4px}
.bu.u{align-self:flex-end;background:rgba(253,185,19,.12);border:1px solid rgba(253,185,19,.25);border-top-right-radius:4px}
.bu .mt{display:block;font-size:12px;color:var(--mut);margin-bottom:3px;white-space:normal}
.bu .mt b{color:var(--sub)}
.bu .fi{display:block;margin-top:6px;font-size:12.5px;color:var(--sub)}
@media(max-width:620px){.bu{max-width:94%}}
/* Order page */
.ohero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;padding:22px 24px}
.ohero h1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 6px}
.hp{font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;letter-spacing:.02em}
.hp.ok{background:rgba(52,211,153,.14);color:var(--ok)}.hp.warn{background:rgba(251,191,36,.14);color:var(--warn)}.hp.bad{background:rgba(248,113,113,.16);color:var(--bad)}
.ometa{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px;color:var(--sub)}
.oacts{display:flex;gap:8px;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.steps span{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--mut);font-weight:600}
.steps span i{font-style:normal;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--raise);font-size:12px;flex:none}
.steps span.on{border-color:var(--y);color:var(--ink)}.steps span.on i{background:var(--y);color:#0b0d14}
.steps span.done{color:var(--sub)}.steps span.done i{background:rgba(52,211,153,.18);color:var(--ok)}
@media(max-width:900px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpis div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpis span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.kpis b{font-size:22px;color:var(--ink);line-height:1.25}.kpis small{font-size:12.5px;color:var(--mut)}
.kpis b.g,.money .g,.facts b.g{color:var(--ok)}.kpis b.r,.money .r,.facts b.r{color:var(--bad)}.kpis b.w{color:var(--warn)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.attn{border-color:rgba(248,113,113,.45);background:linear-gradient(180deg,rgba(248,113,113,.07),var(--panel) 70%)}
.attn h2{color:var(--bad);margin-bottom:6px}
.arow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft);font-size:14px;color:var(--sub)}.arow:last-child{border-bottom:0}
.arow .tx{flex:1;min-width:0}.arow b{color:var(--ink)}
.alist{display:flex;flex-direction:column;gap:3px;margin-top:4px}.alist span{font-size:13.5px;color:var(--sub);padding-left:12px;position:relative}.alist span:before{content:"·";position:absolute;left:2px;color:var(--mut)}.alist .more{color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;align-self:flex-start;margin-top:5px}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.y{background:var(--y)}
.otabs{display:flex;gap:4px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px}
.otabs a{padding:12px 18px;text-decoration:none;color:var(--mut);font-weight:700;font-size:14.5px;border-bottom:3px solid transparent;margin-bottom:-1px}
.otabs a.on{color:var(--ink);border-bottom-color:var(--y)}
.otabs em{font-style:normal;background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-left:4px}
.os{padding:20px 22px}
.osh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.osh h2{font-size:17px;margin:0}.why{font-size:13px;color:var(--mut);margin:4px 0 0;line-height:1.45}
.lead{font-size:15.5px;line-height:1.6;color:var(--ink);margin:0}
.nextbox{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(253,185,19,.08);border:1px solid rgba(253,185,19,.3)}
.nextbox p{margin:4px 0 0;color:var(--ink);font-weight:600}
table.t2{width:100%;border-collapse:collapse;font-size:14px}
table.t2 th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:0 10px 8px;border-bottom:1px solid var(--line)}
table.t2 td{padding:11px 10px;border-bottom:1px solid var(--soft);vertical-align:top;color:var(--sub);line-height:1.45}
table.t2 tr:last-child td{border-bottom:0}table.t2 td b{color:var(--ink)}
table.t2 td.nw{white-space:nowrap}table.t2 td.num{color:var(--mut);font-weight:700}table.t2 tr.dn td{color:var(--mut)}
table.t2 td.acts{white-space:nowrap;text-align:right}table.t2 td.acts .btn{margin-left:4px}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}.sub.ev{color:var(--sub)}
@media(max-width:700px){table.t2 thead{display:none}table.t2 tr{display:block;padding:10px 0;border-bottom:1px solid var(--soft)}table.t2 td{display:block;border:0;padding:3px 0}table.t2 td.acts{text-align:left}}
ul.clean,ol.clean{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.clean li,ol.clean li{position:relative;padding-left:18px;font-size:14px;color:var(--sub);line-height:1.5}
ul.clean li:before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--y)}
ol.clean{counter-reset:n}ol.clean li{padding-left:28px;counter-increment:n}ol.clean li:before{content:counter(n);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--raise);font-size:11.5px;font-weight:700;color:var(--sub);display:flex;align-items:center;justify-content:center}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--raise);color:var(--y);border-radius:6px;padding:1px 6px;margin-right:6px}
.plan{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--raise)}
.plan h3{margin:4px 0}.pp{font-size:18px;font-weight:800;color:var(--y);white-space:nowrap}
.quote{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:12px 14px;border-left:3px solid var(--y);background:rgba(253,185,19,.05);border-radius:0 10px 10px 0;font-size:14px;color:var(--ink);font-style:italic}
.quote .btn{font-style:normal;flex:none;margin-left:auto}
table.money{width:100%;border-collapse:collapse;font-size:14.5px}
table.money td{padding:8px 0;border-bottom:1px solid var(--soft);color:var(--sub)}table.money td:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
table.money tr.tot td{border-bottom:0;border-top:2px solid var(--line);padding-top:12px;font-weight:800;font-size:17px;color:var(--ink)}
table.money small{font-size:12.5px;color:var(--mut);font-weight:600}
.verdict{display:inline-block;font-size:18px;font-weight:800;text-transform:capitalize;padding:6px 14px;border-radius:10px;margin-bottom:10px}
.verdict.bad{background:rgba(248,113,113,.14);color:var(--bad)}.verdict.ok{background:rgba(52,211,153,.13);color:var(--ok)}.verdict.y{background:rgba(253,185,19,.13);color:var(--y)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{background:var(--raise);border-radius:10px;padding:10px 12px}.facts span{display:block;font-size:12px;color:var(--mut)}.facts b{font-size:15px;color:var(--ink)}
.kt{white-space:pre-wrap;font-size:14px;line-height:1.6;color:var(--ink);background:var(--raise);border-radius:10px;padding:14px 16px}
.dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px 14px;margin:0;font-size:14px}
.dl dt{color:var(--mut);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}.dl dd{margin:0;color:var(--ink);line-height:1.5}
@media(max-width:520px){.dl{grid-template-columns:1fr}.dl dd{margin-bottom:6px}}
.mcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.mcard.pend{border-color:rgba(251,191,36,.45)}.mcard.rep{border-color:rgba(253,185,19,.45)}
.mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.mh .sub{margin:0}
.digest{margin-top:10px;font-size:14px;color:var(--sub);background:var(--raise);border-radius:10px;padding:10px 12px}
.dsep{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;font-weight:700;margin:6px 0}.dsep:before,.dsep:after{content:"";flex:1;height:1px;background:var(--line)}
.tl div{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--soft);font-size:14px;color:var(--sub)}.tl div .sub{flex:none;width:120px;margin:0}.tl b{color:var(--ink);margin-right:4px}
.tl{max-height:none}
.dv{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--panel)}
.dv.dn{border-color:rgba(52,211,153,.35)}.dv.qf{border-color:rgba(248,113,113,.55)}
.dvh{display:flex;gap:12px;align-items:flex-start}.dvn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--raise);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:var(--sub)}
.dv.dn .dvn{background:rgba(52,211,153,.18);color:var(--ok)}
.dvt{flex:1;min-width:0}.dvt b{color:var(--ink);font-size:14.5px;line-height:1.45}.dvs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.qan{margin:10px 0 0 38px;font-size:13.5px;color:var(--bad)}
.pfs{display:flex;flex-direction:column;gap:6px;margin:12px 0 0 38px}
.pf{display:flex;gap:10px;align-items:flex-start;background:var(--raise);border-radius:10px;padding:9px 12px}
.pfi{font-size:18px;line-height:1.2}.pft{flex:1;min-width:0;font-size:13px;color:var(--mut)}.pft a{color:var(--ink);text-decoration:none}.pft a:hover{color:var(--y)}.pft span{display:block;margin-top:2px}
.pft details{margin-top:4px}.pft summary{cursor:pointer;color:var(--sub);font-weight:600}.hist{margin:6px 0 0;padding-left:16px}
.padd{display:flex;gap:8px;margin:12px 0 0 38px;flex-wrap:wrap}.padd input{flex:1;min-width:220px;min-height:36px;font-size:13.5px}
.ck{margin:12px 0 0 38px;border-radius:10px;padding:12px 14px;background:var(--raise);font-size:13.5px;color:var(--sub);border-left:3px solid var(--line)}
.ck.ok{border-left-color:var(--ok)}.ck.warn{border-left-color:var(--warn)}.ck.bad{border-left-color:var(--bad)}
.ckh{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}.ckh b{color:var(--ink)}.ckh span{color:var(--mut);font-size:12px}.ck p{margin:0 0 6px}
.ckl{margin-top:8px}.ckl span{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}.ckl.bad span{color:var(--bad)}.ckl.warn span{color:var(--warn)}.ckl.ok span{color:var(--ok)}
.ckl ul{margin:4px 0 0;padding-left:18px}.ckl li{margin:2px 0}
.qab{display:flex;gap:8px;margin:12px 0 0 38px;flex-wrap:wrap}.qab input{flex:1;min-width:200px;min-height:36px;font-size:13.5px}
@media(max-width:620px){.pfs,.padd,.ck,.qab,.qan{margin-left:0}}
.upd{border-width:1px}.upd.bad{border-color:rgba(248,113,113,.5)}.upd.warn{border-color:rgba(251,191,36,.5)}.upd.ok{border-color:rgba(52,211,153,.35)}
.upd textarea{min-height:110px}
.asknext{background:var(--raise);border-radius:10px;padding:10px 14px;margin-bottom:10px}.asknext .lbl{display:block;margin-bottom:6px}
.ac2{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;border-left-width:4px}
.ac2.open{border-left-color:var(--warn)}.ac2.sent,.ac2.waiting{border-left-color:var(--y)}.ac2.done{border-left-color:var(--ok);opacity:.75}.ac2.blocked{border-left-color:var(--bad)}
.ach{display:flex;gap:10px;align-items:flex-start}.ach .tx{flex:1;min-width:0}.ach b{color:var(--ink);font-size:14.5px}
.newb{display:inline-block;font-size:11px;font-weight:700;color:#0b0d14;background:var(--y);border-radius:6px;padding:0 6px;margin-bottom:4px}
.clink{color:inherit;text-decoration:none}.clink:hover{color:var(--y)}
.afil{display:flex;gap:6px;flex-wrap:wrap}.afil a{padding:8px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--sub);text-decoration:none;font-size:13.5px;font-weight:600}
.afil a.on{border-color:var(--y);color:var(--ink)}.afil em,.otabs em.n{font-style:normal;background:var(--raise);color:var(--sub);border-radius:999px;padding:0 7px;font-size:12px;margin-left:4px}
.qlist{margin:10px 0 0 22px;padding-left:18px;font-size:14px;color:var(--ink)}.qlist li{margin:6px 0}.qlist li>span:first-child{margin-right:6px}.qa2{font-size:13px;color:var(--ok);margin-top:2px}
.mx{margin:10px 0 0 22px}.mx summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--sub)}.mx .msg{margin-top:8px}
.rbox{display:flex;flex-direction:column;gap:8px;margin:12px 0 0 22px}.rbox textarea{min-height:80px;font-size:14px}.rbox .btn{align-self:flex-start}
@media(max-width:620px){.qlist,.mx,.rbox{margin-left:0}}
.rk{padding:12px 0;border-bottom:1px solid var(--soft);font-size:14px}.rk:last-child{border-bottom:0}.rk b{color:var(--ink);line-height:1.45}
.astat{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0 0 22px;padding-top:10px;border-top:1px solid var(--soft);font-size:13px;color:var(--mut)}.astat span{margin-right:auto}
.lnk{background:none;border:0;padding:4px 0;color:var(--sub);font:600 13px var(--f);cursor:pointer;text-decoration:underline;text-underline-offset:3px}.lnk:hover{color:var(--ink)}.lnk.bad{color:var(--bad)}
@media(max-width:620px){.astat{margin-left:0}}
.att{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}.att label{cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.th{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--raise);border-radius:8px;padding:4px;font-size:12.5px;color:var(--sub);text-decoration:none;max-width:220px}
.th img{width:84px;height:60px;object-fit:cover;border-radius:6px;display:block}.th button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:12px;cursor:pointer;line-height:1}
.edit{margin:10px 0 0 22px;padding:12px;border-radius:10px;background:var(--raise)}.edit .lbl{display:block;margin-bottom:6px}.edit textarea{min-height:140px}
.eq{display:flex;gap:6px;margin-bottom:6px}.eq input{min-height:36px;font-size:14px}
.decide{margin:10px 0 0 22px;padding:12px;border-radius:10px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.35);font-size:14px;color:var(--sub)}.decide b{color:var(--bad)}
@media(max-width:620px){.edit,.decide{margin-left:0}}
.inb{border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:12px 14px;margin-bottom:12px}.inb.urgent{border-left-color:var(--bad);animation:pulse 1.6s ease-in-out infinite}.inb.important{border-left-color:var(--warn)}.inb.normal{border-left-color:var(--line)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0)}50%{box-shadow:0 0 0 4px rgba(248,113,113,.25)}}

.swot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.swot>div{border-radius:10px;padding:10px 12px;background:var(--raise);font-size:13.5px}.swot span{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.swot ul{margin:6px 0 0;padding-left:16px;color:var(--sub)}.swot .s span{color:var(--ok)}.swot .w span{color:var(--bad)}.swot .o span{color:var(--y)}.swot .t span{color:var(--warn)}
@media(max-width:620px){.swot{grid-template-columns:1fr}}

</head>
<body>
<header class="top">
  <a class="brand" href="/team"><img src="/assets/img/logo-96.webp" alt=""><span><b>Order desk</b><small id="who">Team</small></span></a>
  <div class="row" style="gap:8px"><button class="btn sm ghost hide" id="out" type="button">Sign out</button></div>
</header>
<main class="wrap" id="app"><div class="card">Loading…</div></main>
<div class="busy hide" id="busy"><div class="spin"></div><div id="busyT">Working…</div></div>
<script>
const $ = s => document.querySelector(s), app = $("#app");
const E = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const num2 = v => { const x = Number(v); return isFinite(x) ? x : 0; };
const money = v => v == null ? "n/a" : "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits:Number(v) % 1 ? 2 : 0, maximumFractionDigits:2 });
const STAGES = [["access","Waiting for access"],["work","In work"],["qa","QA check"],["ready","Ready to deliver"],["delivered","Delivered"],["done","Closed"]];
const SN = Object.fromEntries(STAGES.concat([["cancelled","Cancelled"]]));
const RNAME = { admin:"Owner", sales:"Sales", comms:"Client messages", pm:"Project team", qa:"QA", manager:"Manager" };
let ME = null, ORD = [], QUEUE = [];
async function api(a, body, params){
  const r = await fetch("/api/team?a=" + a + (params || ""), body ? { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({ ok:false, error:"No answer" }));
  if(j.signin){ signin(); throw new Error("signin"); }
  if(!j.ok) throw new Error(j.error || "Something went wrong");
  return j;
}
function busy(t){ $("#busyT").textContent = t || "Working…"; $("#busy").classList.toggle("hide", !t); }
function toast(t, bad){ const d = document.createElement("div"); d.className = "toast"; d.textContent = t; if(bad) d.style.borderColor = "var(--bad)"; document.body.appendChild(d); setTimeout(() => d.remove(), 4200); }
async function act(fn, t){ busy(t); try{ return await fn(); }catch(e){ if(e.message !== "signin") toast(e.message, 1); }finally{ busy(""); } }
const can = w => ME.role === "admin" || ME.role === "manager" || (Array.isArray(w) ? w : [w]).includes(ME.role);

function signin(){
  $("#out").classList.add("hide"); $("#who").textContent = "Team";
  app.innerHTML = `<div class="card" style="max-width:460px;margin:40px auto"><h1>Sign in</h1><p class="note">Type the sign-in code Manav gave you.</p>
  <form id="sf" class="grid" style="gap:12px"><label class="f">Your code<input id="code" autocomplete="off" autocapitalize="characters" placeholder="10 letters and numbers"></label><button class="btn pri">Sign in</button></form>
  <p class="note" style="margin-top:14px">Manav: sign in on the <a href="/portal/admin">admin console</a>, then come back here.</p></div>`;
  $("#sf").onsubmit = e => { e.preventDefault(); act(async () => { await api("login", { code:$("#code").value }); boot(); }, "Signing in…"); };
}
async function boot(){
  try{ const j = await api("me"); ME = Object.assign(j.me, { ai:j.ai, cfg:j.cfg, gigs:j.gigs, people:j.people, access:j.access, accessEmail:j.accessEmail, roles:j.roles || ["sales", "comms", "pm", "qa", "manager"] }); }catch(e){ return; }
  $("#who").textContent = ME.name + " · " + (RNAME[ME.role] || ME.role); $("#out").classList.remove("hide");
  route();
}
$("#out").onclick = () => act(async () => { await api("logout", {}); location.hash = ""; signin(); });
window.onhashchange = route;
function tabs(on){
  const P_ = ME.role === "pm" || ME.role === "qa";
  const t = P_ ? [["my","My work"],["board","Orders"]] : [["board","Orders"],["clients","Clients"]];
  if(can("sales")) t.push(["new","New order"], ["lead","Lead help"]);
  if(!P_) t.push(["msgs","Client messages"]); else t.push(["access","Access"]);
  if(ME.role === "admin" || ME.role === "manager") t.push(["score","Scorecard"]);
  if(ME.role === "admin") t.push(["hod","HoD report"], ["pay","Payments"], ["people","Team and settings"]);
  const qn = QUEUE.length;
  return `<nav class="tabs">${t.map(x => `<a href="#${x[0]}" class="${x[0] === on ? "on" : ""}">${x[1]}${x[0] === "msgs" && qn ? `<span class="n">${qn}</span>` : ""}</a>`).join("")}</nav>
  ${ME.ai ? "" : `<div class="note" style="border-color:var(--warn)"><b>AI helpers are off.</b> Orders, checklists and gates all work. The brief, client profile, price check and lead help start once the API key is added in Vercel.</div>`}`;
}
async function route(){
  if(!ME) return;
  const h = location.hash.slice(1) || ((ME.role === "pm" || ME.role === "qa") ? "my" : "board");
  try{
    if(h.startsWith("o=")) return order(decodeURIComponent(h.slice(2)));
    if(h === "new") return newOrder();
    if(h === "lead") return lead();
    if(h === "msgs") return msgs();
    if(h === "score") return scorecard();
    if(h === "people") return peoplePage();
    if(h === "clients") return clientsPage();
    if(h.startsWith("c=")) return clientPage(decodeURIComponent(h.slice(2)));
    if(h === "pay") return payPage();
    if(h === "my") return myWork();
    if(h === "hod") return hodPage();
    if(h === "access") return myWork(true);
    return board();
  }catch(e){ if(e.message !== "signin") app.innerHTML = `<div class="card err">${E(e.message)}</div>`; }
}
async function refresh(){ const [l, q] = await Promise.all([api("list"), api("queue")]); ORD = l.orders; QUEUE = q.items; }

/* Orders board, with each person's next steps on top */
async function board(){
  await refresh();
  const mine = o => ME.role === "admin" || ME.role === "manager" || (ME.role === "pm" && o.pm === ME.uid) || (ME.role === "qa" && (o.qa === ME.uid || !o.qa)) || (ME.role === "sales" && o.by === ME.uid) || ME.role === "comms";
  const next = [];
  ORD.filter(o => !["done","cancelled"].includes(o.stage)).forEach(o => {
    const hot = o.flags.some(f => f.k === "bad"), go = (t, d) => next.push({ id:o.id, t, d, hot });
    if((ME.role === "pm" && o.pm === ME.uid) || ME.role === "admin" || ME.role === "manager"){
      if(o.stage === "access" && o.accessLeft) go(o.id + ": check access", o.accessLeft + " access item" + (o.accessLeft > 1 ? "s" : "") + " still missing");
      if(o.stage === "work") go(o.id + ": finish the work", "Each deliverable needs a proof link, then send to QA");
    }
    if((ME.role === "qa" || ME.role === "admin" || ME.role === "manager") && o.stage === "qa") go(o.id + ": QA check", "Check every deliverable live");
    if((ME.role === "comms" || ME.role === "admin" || ME.role === "manager") && o.stage === "ready") go(o.id + ": deliver", "QA passed. Send the delivery to the client");
    if((ME.role === "admin" || ME.role === "manager") && !o.pm) go(o.id + ": pick the project team", o.client.name || o.gigName);
  });
  if(QUEUE.length && (ME.role === "comms" || ME.role === "admin" || ME.role === "manager")) next.unshift({ link:"#msgs", t:QUEUE.length + " client message" + (QUEUE.length > 1 ? "s" : ""), d:"To send or to read", hot:true });
  const cols = STAGES.map(([k, n]) => { const l = ORD.filter(o => o.stage === k && mine(o)); return `<div class="col"><h3><span>${n}</span><span>${l.length}</span></h3>${l.map(card).join("") || `<div class="empty-col">Nothing here</div>`}</div>`; }).join("");
  app.innerHTML = tabs("board") + (next.length ? `<div><div class="lbl" style="margin-bottom:8px">Your next steps</div><div class="next">${next.slice(0, 12).map(n => `<a href="${n.link || "#o=" + n.id}" class="${n.hot ? "hot" : ""}"><b>${E(n.t)}</b>${E(n.d)}</a>`).join("")}</div></div>` : "")
    + (ORD.length ? `<div class="board">${cols}</div>` : `<div class="card"><h2>No orders yet</h2><p class="note">${can("sales") ? `When a client hires us, open <a href="#new">New order</a> and paste the whole chat.` : "Orders appear here as soon as sales adds them."}</p></div>`);
}
function card(o){
  const left = Math.ceil((Date.parse(o.deadline + "T23:59:00") - Date.now()) / 864e5);
  return `<a class="oc" href="#o=${E(o.id)}"><b>${E(o.client.name || o.id)}</b>${E(o.id)} · ${E(o.gigName)}<br>${money(o.price)} · ${left >= 0 ? left + " day" + (left === 1 ? "" : "s") + " left" : "late"}${o.revisions ? " · " + o.revisions + " revision" + (o.revisions > 1 ? "s" : "") : ""}
  <div class="fl">${o.flags.map(f => `<span class="chip ${f.k}">${E(f.t)}</span>`).join("")}${o.verdict ? `<span class="chip n">${E(o.verdict)}</span>` : ""}</div></a>`;
}

/* New order */
function newOrder(){
  if(!can("sales")) return board();
  const g0 = ME.gigs[0], d = new Date(Date.now() + 5 * 864e5).toISOString().slice(0, 10);
  app.innerHTML = tabs("new") + `<form class="card" id="nf"><h2>New hired order</h2><p class="note">Paste everything: the whole chat, call notes, anything you promised. The order desk reads it and prepares the brief, access list, client profile and price check, so the project team never has to read the chat.</p>
  <div class="fg">
   <label class="f w2">Gig<select id="gig">${ME.gigs.map(g => `<option value="${g.id}">${E(g.name)}</option>`).join("")}</select></label>
   <label class="f">Price the client paid (USD)<input id="price" type="number" min="1" step="1"></label>
   <label class="f">Deadline<input id="deadline" type="date" value="${d}"></label>
   <div class="w4"><div class="lbl" style="margin-bottom:6px">Package</div><div class="pk" id="pk"></div></div>
   <label class="f">Client name or username<input id="client" placeholder="As shown in the chat"></label>
   <label class="f">Country<input id="country" placeholder="e.g. United States"></label>
   <label class="f w2">Client website<input id="website" placeholder="https://"></label>
   <label class="f w4">Extras added to the order<input id="extras" placeholder="e.g. 2 extra pages, fast delivery"></label>
   <label class="f w4">The whole chat with the client<textarea class="big" id="chat" placeholder="Paste the full conversation, from the first message to the order"></textarea></label>
   <label class="f w2">Call notes<textarea id="calls" placeholder="What was said on calls: goals, worries, promises"></textarea></label>
   <label class="f w2">Special remarks for the team<textarea id="remarks" placeholder="Anything the chat does not show: client mood, what we promised, what to avoid"></textarea></label>
  </div><div class="row" style="margin-top:14px;gap:10px"><button class="btn pri">Create order</button><span class="note" id="nfh"></span></div></form>`;
  const drawPk = () => { const g = ME.gigs.find(x => x.id === $("#gig").value), cur = (document.querySelector("#pk input:checked") || {}).value || "standard";
    $("#pk").innerHTML = ["basic","standard","premium"].map(k => `<label class="${k === cur ? "on" : ""}"><input type="radio" name="pkg" value="${k}" ${k === cur ? "checked" : ""}><b>${k[0].toUpperCase() + k.slice(1)} · $${g.packages[k].price}</b>${E(g.packages[k].what)}</label>`).join("");
    $("#price").value = g.packages[cur].price; $("#nfh").textContent = "Access we will ask for: " + (ME.access[g.cat] || []).map(a => a.item).join(", ");
    $("#website").placeholder = g.cat === "ecom" ? "https://yourstore.com" : g.cat === "ads" ? "https://landing-page.com" : "https://clientsite.com";
    document.querySelectorAll("#pk input").forEach(i => i.onchange = drawPk); };
  $("#gig").onchange = drawPk; drawPk();
  $("#nf").onsubmit = e => { e.preventDefault(); const v = id => $("#" + id).value;
    act(async () => { const r = await api("create", { gig:v("gig"), pkg:(document.querySelector("#pk input:checked") || {}).value, price:v("price"), deadline:v("deadline"), client:v("client"), country:v("country"), website:v("website"), extras:v("extras"), chat:v("chat"), calls:v("calls"), remarks:v("remarks") });
      if(r.ai && !r.ai.ok) toast(r.ai.why, 1); location.hash = "#o=" + r.id; }, ME.ai ? "The order desk is reading the chat and checking the website. About 30 to 60 seconds." : "Creating the order…"); };
}

/* One order */
let CUR = null, CLINFO = null;
async function order(id){
  CLINFO = null;
  if(!CUR || CUR.order.id !== id) OTAB = "overview";
  const j = await api("order", null, "&id=" + encodeURIComponent(id)); CUR = j; CLINFO = j.client; drawOrder();
}
async function doOp(op, body, t){ const r = await act(() => api("do", Object.assign({ id:CUR.order.id, op }, body || {})), t || "Saving…"); if(r){ CUR = r; drawOrder(); } return r; }
let OTAB = "overview";
const TODAY = () => new Date().toISOString().slice(0, 10);
const fmtD = d => { if(!d) return ""; const x = new Date(d.length === 10 ? d + "T12:00:00" : d); return isNaN(x) ? E(d) : x.toLocaleDateString("en-GB", { day:"numeric", month:"short" }); };
const ago = t => t ? new Date(t).toLocaleString("en-GB", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }) : "";
const kept = p => /kept/i.test(p.status || "");
const broken = p => /broken/i.test(p.status || "");
function health(o, x){
  const left = Math.ceil((Date.parse(o.deadline + "T23:59:00") - Date.now()) / 864e5), open = !["delivered","done","cancelled"].includes(o.stage);
  const over = ((o.ai || {}).promises || []).filter(p => p.by && !kept(p) && p.by < TODAY()).length;
  if(!open) return { k:"ok", t:o.stage === "cancelled" ? "Cancelled" : "Delivered", left, over };
  if(left < 0) return { k:"bad", t:"Late", left, over };
  if(over || left <= 1 || o.alert) return { k:"bad", t:"At risk", left, over };
  if(/at risk|late/i.test((o.ai || {}).health || "")) return { k:"bad", t:"At risk", left, over };
  if(left <= 2 || o.stage === "access" || /watch/i.test((o.ai || {}).health || "")) return { k:"warn", t:"Watch", left, over };
  return { k:"ok", t:"On track", left, over };
}
function sec(title, why, body, extra){ return `<section class="card os"><div class="osh"><div><h2>${title}</h2>${why ? `<p class="why">${why}</p>` : ""}</div>${extra || ""}</div>${body}</section>`; }
function drawOrder(){
  const o = CUR.order, x = CUR.econ, ai = o.ai || {}, gig = ME.gigs.find(g => g.id === o.gig) || {};
  const L = (arr, f) => (arr || []).map(f).join("");
  const pr = ai.price || {}, pf = ai.profile || {}, st = ai.site || {}, rt = ai.retainer || {};
  const h = health(o, x), si = STAGES.findIndex(s => s[0] === o.stage);
  const accOk = o.access.filter(a => ["received","skip"].includes(a.status)).length, delDone = o.deliverables.filter(d => d.done).length;
  const proms = ai.promises || [], openP = proms.filter(p => !kept(p)).length;
  const toSend = (o.queue || []).filter(m => !m.sent).length, newRep = (o.queue || []).filter(m => m.reply && !m.seen).length;
  const vcol = /under/i.test(pr.verdict || "") ? "bad" : /bargain/i.test(pr.verdict || "") ? "ok" : "y";
  const pmOpt = r => `<option value="">Not set</option>` + ME.people.filter(p => p.role === r || p.role === "manager").map(p => `<option value="${p.id}" ${o[r] === p.id ? "selected" : ""}>${E(p.name)}</option>`).join("");
  const nextBtn = {
    access: can("assign") ? `<button class="btn" id="anyway">Start before all access is in</button>` : "",
    work: can("pm") ? (o.deliverables.every(d => d.done && (d.proofs || []).length + (d.proof ? 1 : 0)) ? `<button class="btn pri" id="toqa">Send to QA</button>` : `<button class="btn" disabled title="Every deliverable needs proof and Mark done first">Send to QA · ${o.deliverables.filter(d => d.done).length} of ${o.deliverables.length} done</button>`) : "",
    qa: can("qa") ? `<button class="btn pri" id="qafin">Finish QA · ${o.deliverables.filter(d => d.qa).length} of ${o.deliverables.length} marked</button>` : "",
    ready: can("comms") ? `<button class="btn pri" id="deliver">Delivered to the client</button>` : "",
    delivered: can("comms") ? `<button class="btn danger" id="rev">Client asked for a revision</button><button class="btn pri" id="close">Client accepted: close</button>` : ""
  }[o.stage] || "";

  /* Needs attention: the few things that matter right now */
  const att = [];
  const odP = proms.filter(p => p.by && !kept(p) && p.by < TODAY()), tdP = proms.filter(p => p.by && !kept(p) && p.by === TODAY());
  if(odP.length) att.push({ k:"bad", t:odP.length + " promise" + (odP.length > 1 ? "s" : "") + " overdue", list:odP.map(p => p.what), go:"overview", goT:"See promises" });
  if(tdP.length) att.push({ k:"warn", t:tdP.length + " promise" + (tdP.length > 1 ? "s" : "") + " due today", list:tdP.map(p => p.what), go:"overview", goT:"See promises" });
  if(o.alert) att.push({ k:"bad", t:"Scope alert", d:o.alert, btn:`<button class="btn sm" id="clr">Checked, clear</button>` });
  if(newRep) att.push({ k:"y", t:"New client reply", d:"Read it in the Client tab", go:"client" });
  if(toSend) att.push({ k:"y", t:toSend + " message" + (toSend > 1 ? "s" : "") + " to send", d:"Ready in the Client tab", go:"client" });
  if(!o.pm && !["done","cancelled"].includes(o.stage)) att.push({ k:"warn", t:"No project team yet", d:"Pick one on the right" });

  const sinceH = (Date.now() - Date.parse(o.lastUpdateAt || o.at)) / 36e5, openO = !["done","cancelled"].includes(o.stage), PJ = ME.role === "pm" || ME.role === "qa";
  const upd = openO && !PJ && (can("comms") || can("pm")) ? `<section class="card upd ${sinceH > 24 ? "bad" : sinceH > 8 ? "warn" : "ok"}"><div class="osh"><div><h2>Keep this order up to date</h2>
     <p class="why">Paste anything new: client messages (the whole chat again is fine, only new ones are added), call notes, a reply from the project team, or files shared. The order desk adds what is new and re-checks promises, risks and actions.</p></div>
     <span class="chip ${sinceH > 24 ? "bad" : sinceH > 8 ? "warn" : "ok"}">Last update ${sinceH < 1 ? "under an hour" : Math.round(sinceH) + " h"} ago${o.lastUpdateBy ? " · " + E(o.lastUpdateBy) : ""}</span></div>
     ${(ai.askNext || []).length ? `<div class="asknext"><span class="lbl">Paste or ask next</span><ul class="clean">${ai.askNext.slice(0, 4).map(x => `<li>${E(x)}</li>`).join("")}</ul></div>` : ""}
     ${ai.changed ? `<p class="note" style="margin:10px 0"><b>Last change:</b> ${E(ai.changed)}</p>` : ""}
     <textarea id="updT" placeholder="Paste new messages, the whole chat again, call notes, a team reply, or screenshots"></textarea>${attUI("upd1")}
     <div class="row" style="gap:8px;margin-top:8px"><button class="btn pri" id="updB">Update order</button><span class="sub" style="margin:0">Logins and email addresses are hidden automatically.</span></div></section>` : "";
  const ACT = { open:["Open","warn"], sent:["Sent","y"], waiting:["Waiting reply","y"], done:["Done","ok"], blocked:["Blocked","bad"], decide:["Needs a decision","bad"], skipped:["Skipped","n"] }, OWN = { comms:"Client messages", pm:"Project team", qa:"QA", manager:"Manager" };
  const TYP = { client:"Send to the client", internal:"Ask the team", task:"Task" };
  (o.actions || []).forEach(a => { if(a.message) a.message = a.message.replace(/\[(order id|order number|order)\]/gi, o.id); });
  const shut = x => x.status === "done" || x.status === "skipped";
  const acts = (o.actions || []).slice().sort((a, b) => (shut(a) - shut(b)) || (({ high:0, medium:1, low:2 })[a.severity] - ({ high:0, medium:1, low:2 })[b.severity]));
  const actCard = a => { const isI = a.type === "internal", qs = a.questions || [], ans = qs.filter(q => q.status === "answered").length;

/* Screenshots and files: paste into a box (Ctrl+V) or attach. Images are shrunk in the browser before upload. */
const FILES = {};
const attUI = k => `<div class="att"><label class="btn sm ghost">📎 Attach screenshots or PDF<input type="file" accept="image/*,application/pdf" multiple hidden data-att="${k}"></label><span class="sub" style="margin:0">or paste a screenshot straight into the box</span></div><div class="thumbs" data-th="${k}"></div>`;
function shrink(file){ return new Promise((res, rej) => {
  if(file.type === "application/pdf"){ if(file.size > 2.3e6) return rej(new Error(file.name + " is over 2 MB")); const r = new FileReader(); r.onload = () => res({ name:file.name, type:file.type, data:String(r.result).split(",")[1] }); r.readAsDataURL(file); return; }
  const img = new Image(), u = URL.createObjectURL(file);
  img.onload = () => { const m = 1600, sc = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res({ name:(file.name || "screenshot").replace(/\.\w+$/, "") + ".jpg", type:"image/jpeg", data:c.toDataURL("image/jpeg", 0.82).split(",")[1] }); };
  img.onerror = () => rej(new Error("Could not read " + (file.name || "the image"))); img.src = u; }); }
async function addFiles(k, list){
  FILES[k] = FILES[k] || [];
  for(const f of list){ if(FILES[k].length >= 6){ toast("Up to 6 files at a time", 1); break; } try{ FILES[k].push(await shrink(f)); }catch(e){ toast(e.message, 1); } }
  drawThumbs(k);
}
function drawThumbs(k){ const el = document.querySelector(`[data-th="${k}"]`); if(!el) return;
  el.innerHTML = (FILES[k] || []).map((f, i) => `<span class="th">${f.type === "application/pdf" ? "📄 " + E(f.name) : `<img src="data:${f.type};base64,${f.data}" alt="">`}<button type="button" data-thx="${k}|${i}" title="Remove">×</button></span>`).join("");
  el.querySelectorAll("[data-thx]").forEach(b => b.onclick = () => { const [kk, i] = b.dataset.thx.split("|"); FILES[kk].splice(+i, 1); drawThumbs(kk); }); }
function wireAtt(k, textarea){
  const inp = document.querySelector(`[data-att="${k}"]`); if(inp) inp.onchange = () => { addFiles(k, [...inp.files]); inp.value = ""; };
  if(textarea) textarea.addEventListener("paste", e => { const fs = [...(e.clipboardData || {}).items || []].filter(i => i.kind === "file").map(i => i.getAsFile()).filter(Boolean); if(fs.length){ e.preventDefault(); addFiles(k, fs); toast(fs.length + " screenshot" + (fs.length > 1 ? "s" : "") + " added"); } });
  drawThumbs(k);
}
const fileChips = fs => (fs || []).length ? `<div class="thumbs">${fs.map(f => `<a class="th" href="/api/team?a=file&id=${E(f.id)}" target="_blank" rel="noopener">${/^image/.test(f.type) ? `<img src="/api/team?a=file&id=${E(f.id)}" alt="${E(f.name)}" loading="lazy">` : "📄 " + E(f.name)}</a>`).join("")}</div>` : "";

  app.innerHTML = tabs(accessOnly ? "access" : "my") + (accessOnly ? "" : `<div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div><span>Questions for you</span><b class="${items.some(i => i.urgency === "urgent") ? "r" : ""}">${items.length}</b><small>${items.filter(i => i.urgency === "urgent").length} urgent</small></div><div><span>Your orders</span><b>${orders.length}</b><small>open</small></div><div><span>Waiting for access</span><b class="${orders.some(o => o.accessLeft) ? "w" : "g"}">${orders.filter(o => o.accessLeft).length}</b><small>orders</small></div><div><span>Due in 2 days</span><b class="${orders.some(o => Date.parse(o.deadline) - Date.now() < 2 * 864e5) ? "r" : ""}">${orders.filter(o => Date.parse(o.deadline + "T23:59:00") - Date.now() < 2 * 864e5).length}</b><small>orders</small></div></div>`)
   + `<div class="og"><div>${accessOnly ? "" : sec("Questions for you", "Sales needs these answers to reply to clients. Answer in your own words; screenshots help.", items.map(x => `<div class="inb ${x.urgency}"><div class="ach"><span class="dot ${U[x.urgency][1] === "n" ? "y" : U[x.urgency][1]}"></span><div class="tx"><b>${E(x.site)} · ${E(x.title)}</b>
       <div class="dvs"><span class="chip ${U[x.urgency][1]}">${U[x.urgency][0]}</span>${x.needBy ? `<span class="chip n">Reply by ${E(x.needBy)}</span>` : ""}<span class="chip n">Order due ${fmtD(x.deadline)}</span><a class="sub" style="margin:0" href="#o=${E(x.order)}">Open order</a></div></div></div>
       ${x.shared ? `<div class="msg" style="margin:10px 0 0 22px"><span class="sub">Client wrote${x.shared.time ? " (" + E(x.shared.time) + ")" : ""}:</span>\n${E(x.shared.text)}</div>` : ""}
       <ol class="qlist">${x.questions.map(q => `<li><span>${E(q.q)}</span>${q.status ? `<span class="chip ${q.status === "answered" ? "ok" : q.status === "partial" ? "warn" : "bad"}">${{ answered:"Answered", partial:"Partly", missing:"No answer", disagree:"You disagreed" }[q.status] || q.status}</span>` : ""}</li>`).join("")}</ol>
       <div class="rbox"><textarea data-irt="${x.order}|${x.id}" placeholder="Your answer, with the numbers (paste screenshots here too)"></textarea>${attUI("i" + x.id)}<div class="row" style="gap:8px"><button class="btn sm pri" data-isend="${x.order}|${x.id}">Send answer</button><button class="lnk" data-idis="${x.order}|${x.id}">I disagree with these questions</button></div></div></div>`).join("") || `<p class="note">Nothing waiting for you. Well done.</p>`)}</div>
   <div>${sec(accessOnly ? "Access on your orders" : "Your orders", accessOnly ? "Mark each access item in the order once you have checked the level." : "Newest due first. Red means it needs you now.", orders.map(o => `<a class="oc ${o.flags.some(f => f.k === "bad") ? "blink" : ""}" href="#o=${E(o.id)}"${accessOnly ? "" : ""}><b>${E(o.site || o.id)}</b>${E(o.id)} · ${E(SN[o.stage] || o.stage)} · due ${fmtD(o.deadline)}<br>${o.accessLeft ? `<span style="color:var(--warn)">${o.accessLeft} access missing</span> · ` : ""}${o.done} of ${o.total} deliverables done
      <div class="fl">${o.flags.slice(0, 3).map(f => `<span class="chip ${f.k}">${E(f.t)}</span>`).join("")}</div></a>`).filter((h, i) => !accessOnly || orders[i].accessLeft).join("") || `<p class="note">${accessOnly ? "All access is in on your orders." : "No open orders."}</p>`)}</div></div>`;
  document.querySelectorAll("[data-irt]").forEach(t => wireAtt("i" + t.dataset.irt.split("|")[1], t));
  document.querySelectorAll("[data-isend]").forEach(b => b.onclick = async () => { const [oid, aid] = b.dataset.isend.split("|"), t = document.querySelector(`[data-irt="${b.dataset.isend}"]`).value.trim(), fs = FILES["i" + aid] || [];
    if(!t && !fs.length) return toast("Write your answer first", 1);
    const r = await act(() => api("do", { id:oid, op:"actReply", aid, text:t, files:fs }), "Sending your answer to sales…"); if(r){ delete FILES["i" + aid]; toast("Sent. Thank you."); myWork(); } });
  document.querySelectorAll("[data-idis]").forEach(b => b.onclick = async () => { const [oid, aid] = b.dataset.idis.split("|"), w = prompt("What do you disagree with, and what should we do instead?"); if(!w) return;
    const r = await act(() => api("do", { id:oid, op:"actObject", aid, qn:0, why:w }), "Sending to sales…"); if(r){ toast("Sales will decide and come back to you."); myWork(); } });
}

async function hodPage(refresh){
  const j = await api("hod", null, refresh ? "&refresh=1" : ""), t = j.totals, ins = j.insight || {}, H = h => h >= 48 ? Math.round(h / 24) + " d" : Math.round(h) + " h";
  const side = (k, n) => `<div><span>${n}</span><b class="${t[k] > 48 ? "r" : t[k] > 12 ? "w" : "g"}">${H(t[k])}</b><small>waiting on ${n.toLowerCase()}</small></div>`;
  app.innerHTML = tabs("hod") + `<section class="card ohero"><div><div class="lbl">HoD report · ${fmtD(j.day)}</div><h1 style="font-size:24px">${E(ins.headline || "How the orders are moving")}</h1><div class="ometa"><span>${t.open} open orders</span><span>${t.late} late</span><span>${t.fails} QA fails</span><span>${t.revisions} revisions our fault</span>${ins.at ? `<span>Analysed ${ago(ins.at)}</span>` : ""}</div></div><div class="oacts"><button class="btn" id="hodR">Analyse again</button></div></section>
   <div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">${side("client", "Client")}${side("sales", "Sales")}${side("team", "Project team")}${side("qa", "QA")}</div>
   ${(ins.todayForHod || []).length ? `<section class="card attn"><h2>Only you, today</h2>${ins.todayForHod.map(x => `<div class="arow"><span class="dot bad"></span><div class="tx">${E(x)}</div></div>`).join("")}</section>` : ""}
   <div class="og"><div>
    ${(ins.sides || []).length ? sec("Where time is lost", "Read from the real timing of every step: access, messages, answers, work and QA.", ins.sides.map(x => `<div class="rk"><span class="chip n" style="margin-bottom:6px">${E(x.side)}</span><div>${E(x.finding)}</div></div>`).join("")) : ""}
    ${(ins.improve || []).length ? sec("What would improve productivity", "", ins.improve.map(x => `<div class="rk"><b>${E(x.what)}</b><div class="sub ev">${E(x.impact)}</div></div>`).join("")) : ""}
    ${sec("Orders, slowest first", "Hours each side has held the order up. Open items are still waiting now.", `<table class="t2"><thead><tr><th>Order</th><th>Client</th><th>Sales</th><th>Team</th><th>QA</th></tr></thead><tbody>${j.orders.map(x => `<tr><td><a href="#o=${E(x.id)}"><b>${E(x.site || x.id)}</b></a><div class="sub">${E(x.id)} · ${E(SN[x.stage] || x.stage)} · due ${fmtD(x.deadline)}${x.late ? ` · <span style="color:var(--bad)">late</span>` : ""}</div>${x.broken.length ? `<div class="sub" style="color:var(--bad)">${x.broken.length} promise${x.broken.length > 1 ? "s" : ""} broken or overdue</div>` : ""}</td>${["client", "sales", "team", "qa"].map(k => `<td title="${E(x.items[k].map(i => i.what + ": " + H(i.h) + (i.open ? " (still open)" : "")).join("\n"))}"><b class="${x.hours[k] > 24 ? "r" : ""}" style="color:${x.hours[k] > 24 ? "var(--bad)" : "inherit"}">${x.hours[k] ? H(x.hours[k]) : "0"}</b>${x.items[k].some(i => i.open) ? `<div class="sub">open</div>` : ""}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="5">No open orders</td></tr>`}</tbody></table>`)}
   </div><div>
    ${(ins.missed || []).length ? sec("Missed or broken", "", `<ul class="clean">${ins.missed.map(x => `<li>${E(x)}</li>`).join("")}</ul>`) : ""}
    ${sec("Project team", "Time to answer and to finish work, per person.", `<table class="t2"><tbody>${j.team.map(x => `<tr><td><b>${E(x.name)}</b><div class="sub">${x.orders} order${x.orders > 1 ? "s" : ""}${x.open ? " · " + x.open + " waiting now" : ""}</div></td><td>${H(x.hours)}</td></tr>`).join("")}</tbody></table>`)}
    ${sec("Sales and client messages", "Time to send what the order desk prepared.", `<table class="t2"><tbody>${j.sales.map(x => `<tr><td><b>${E(x.name)}</b><div class="sub">${x.orders} order${x.orders > 1 ? "s" : ""}${x.open ? " · " + x.open + " not sent" : ""}</div></td><td>${H(x.hours)}</td></tr>`).join("")}</tbody></table>`)}
    ${(ins.people || []).length ? sec("People notes", "Fair and specific, from the timings.", ins.people.map(x => `<div class="rk"><b>${E(x.name)}</b><div class="sub ev">${E(x.note)}</div></div>`).join("")) : ""}
   </div></div>`;
  $("#hodR").onclick = () => act(() => hodPage(true), "Analysing every order (about 30 seconds)…");
}

/* Client messages queue */
async function msgs(){
  await refresh();
  app.innerHTML = tabs("msgs") + `<div class="card"><h2>Client messages</h2><p class="note">Messages to send on the marketplace, and client replies the team has not read yet. Copy, send, then mark sent.</p>
  ${QUEUE.map(m => `<div class="ln"><div class="tx"><b>${E(m.order)} · ${E(m.client || "")}</b> <span class="chip ${m.kind === "reply" ? "y" : "warn"}">${m.kind === "reply" ? "Reply not read yet" : "To send"}</span> <span style="color:var(--mut)">${E(m.by)}</span><div class="msg" style="margin-top:6px">${E(m.reply || m.text)}</div></div>
   <div class="ac"><a class="btn sm" href="#o=${E(m.order)}">Open order</a></div></div>`).join("") || `<p class="note">All clear.</p>`}</div>`;
}

/* Lead help */
async function lead(){
  const l = await api("leads");
  app.innerHTML = tabs("lead") + `<div class="og"><div><form class="card" id="lf"><h2>Lead help</h2><p class="note">Stuck with a lead? Paste the whole chat. You get what they really want, how to answer their doubts, the right offer and the exact next message.</p>
   <label class="f">Name for this lead<input id="lt" placeholder="Client name or username"></label>
   <label class="f" style="margin-top:10px">The whole chat<textarea class="big" id="lc" placeholder="Paste every message so far"></textarea></label>
   <label class="f" style="margin-top:10px">Your note<input id="ln" placeholder="e.g. they went quiet after the price"></label>
   <button class="btn pri" style="margin-top:12px" ${ME.ai ? "" : "disabled"}>Help me with this lead</button></form><div id="lr"></div></div>
   <div><div class="card"><h2>Earlier leads</h2>${(l.leads || []).map(x => `<div class="ln"><div class="tx"><b>${E(x.title)}</b> ${x.result ? `<span class="chip ${x.result.stage === "hot" ? "ok" : x.result.stage === "warm" ? "warn" : "n"}">${E(x.result.stage)} · ${E(x.result.chance)}%</span>` : ""}<br><span style="color:var(--mut)">${E(x.byName)}, ${new Date(x.at).toLocaleString()}</span></div><div class="ac"><button class="btn sm" data-l="${x.id}">Open</button></div></div>`).join("") || `<p class="note">None yet.</p>`}</div></div></div>`;
  const show = x => { const r = x.result || {}, of = r.offer || {}, g = ME.gigs.find(y => y.id === of.gig);
    $("#lr").innerHTML = `<div class="card"><h2>${E(x.title)} <span class="chip ${r.stage === "hot" ? "ok" : r.stage === "warm" ? "warn" : "n"}">${E(r.stage)} · ${E(r.chance)}% chance</span></h2>
     <p><b>They really want:</b> ${E(r.wants)}</p><p><b>What stops them:</b> ${E(r.blocker)}</p>
     <div class="lbl" style="margin:10px 0 6px">Send this next</div><div class="msg">${E(r.reply)}</div><button class="btn sm" id="cp" style="margin-top:8px">Copy</button>
     <div class="lbl" style="margin:14px 0 6px">Offer</div><p>${g ? E(g.name) + " · " + E(of.package) + " · $" + E(of.price) : ""}${of.custom ? "<br>" + E(of.custom) : ""}</p>
     ${(r.objections || []).length ? `<div class="lbl" style="margin:12px 0 6px">If they say</div><ul class="p">${r.objections.map(o => `<li><b>${E(o.objection)}</b>: ${E(o.answer)}</li>`).join("")}</ul>` : ""}
     ${(r.dont || []).length ? `<div class="lbl" style="margin:12px 0 6px">Do not</div><ul class="p">${r.dont.map(o => `<li>${E(o)}</li>`).join("")}</ul>` : ""}
     <p style="margin-top:10px"><b>Follow up:</b> ${E(r.followup)}</p>${(r.redFlags || []).length ? `<p style="color:var(--bad)"><b>Watch:</b> ${r.redFlags.map(E).join("; ")}</p>` : ""}</div>`;
    $("#cp").onclick = () => navigator.clipboard.writeText(r.reply || "").then(() => toast("Copied")); };
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => show(l.leads.find(x => x.id === b.dataset.l)));
  $("#lf").onsubmit = e => { e.preventDefault(); act(async () => { const r = await api("lead", { title:$("#lt").value, chat:$("#lc").value, note:$("#ln").value }); await lead(); show(r.lead); }, "Reading the chat…"); };
}

/* Scorecard */
async function scorecard(){
  const m = new URLSearchParams(location.search).get("m") || new Date().toISOString().slice(0, 7), j = await api("score", null, "&m=" + m), s = j.score, ai = j.ai;
  const P = v => v == null ? "n/a" : v + "%";
  app.innerHTML = tabs("score") + `<div class="card"><h2>Scorecard · ${E(m)}</h2><p class="note">The order system works when clients are happy with correct work, the team makes fewer mistakes, clients come back, and every order makes money.</p>
  <div class="lbl" style="margin:10px 0 8px">Clients happy with correct work</div><div class="sc"><div>Client got it right first time<b>${P(s.clientRight)}</b>no revision our fault</div><div>Team right first time<b>${P(s.firstTimeRight)}</b>no revision and no QA fail</div><div>On time<b>${P(s.onTime)}</b>of ${s.delivered} delivered</div><div>Client rating<b>${s.rating == null ? "n/a" : s.rating + " / 5"}</b></div><div>Clients kept<b>${P(s.retained)}</b>ordered again or monthly plan</div></div>
  <div class="lbl" style="margin:16px 0 8px">Mistakes</div><div class="sc"><div>Revisions<b>${s.revisions}</b></div><div>QA first pass<b>${P(s.qaFirstPass)}</b></div>${Object.entries(s.reasons).map(([k, v]) => `<div>${E(k)}<b>${v}</b></div>`).join("")}</div>
  <div class="lbl" style="margin:16px 0 8px">Money</div><div class="sc"><div>Orders<b>${s.orders}</b>${money(s.value)} sold</div><div>We kept<b>${money(s.net)}</b>on delivered orders</div><div>Per order<b>${money(s.netPerOrder)}</b>${P(s.margin)} margin</div><div>AI per order<b>${money(s.aiPerOrder)}</b></div><div>AI this month<b>${money(ai.usd)}</b>of $${ai.credit} monthly credit</div></div></div>
  <div class="og"><div class="card"><h2>Project team</h2>${Object.entries(s.byPm).map(([k, v]) => `<div class="ln"><div class="tx"><b>${E(k)}</b><br>${v.orders} delivered · ${v.revisions} revisions · ${v.qaFails} QA fails · ${v.late} late</div></div>`).join("") || `<p class="note">Fills in as orders are delivered.</p>`}</div>
  <div class="card"><h2>Sales</h2>${Object.entries(s.bySales).map(([k, v]) => `<div class="ln"><div class="tx"><b>${E(k)}</b><br>${v.orders} orders · ${money(v.value)}${v.under ? ` · <span style="color:var(--bad)">${v.under} undercharged</span>` : ""}</div></div>`).join("") || `<p class="note">Fills in as orders come in.</p>`}</div></div>`;
}

/* People and settings (Manav only) */
async function peoplePage(){
  const j = await api("people");
  app.innerHTML = tabs("people") + `<div class="og"><div class="card"><h2>Team</h2><p class="note">Each person signs in with their own code. You see the code once, right after you create it. If a code is lost or someone leaves, make a new code or switch them off.</p>
   ${j.people.map(p => `<div class="ln"><div class="tx"><b>${E(p.name)}</b> <span class="chip n">${E(RNAME[p.role])}</span>${p.off ? ` <span class="chip bad">Off</span>` : ""}</div><div class="ac"><button class="btn sm" data-nc="${p.id}">New code</button><button class="btn sm ${p.off ? "" : "danger"}" data-off="${p.id}">${p.off ? "Switch on" : "Switch off"}</button></div></div>`).join("") || `<p class="note">No one yet.</p>`}
   <form id="pf" class="fg" style="margin-top:14px"><label class="f w2">Name<input id="pn" placeholder="e.g. Divyanshi"></label><label class="f">Role<select id="pr">${ME.roles.map(r => `<option value="${r}">${RNAME[r]}</option>`).join("")}</select></label><button class="btn pri" style="align-self:end">Add person</button></form><div id="pc"></div></div>
   <div class="card"><h2>Google accounts</h2><p class="note">Every Google account the team uses for client access. The order desk reads Search Console, Analytics and Drive proof with whichever account can see it. Connecting asks you to sign in to that account; it is read-only.</p><div id="gacc"><p class="note">Loading…</p></div>
    <div class="row" style="gap:8px;margin-top:12px"><a class="btn sm pri" href="/api/portal?a=g-start&team=1">Connect another Google account</a><button class="btn sm" id="gref" type="button">Refresh what each account can see</button></div></div>
   <form class="card" id="cf"><h2>Money settings</h2><p class="note">Used for the money view of every order and the price check.</p>
   <div class="grid" style="gap:10px"><label class="f">Marketplace fee (%)<input id="cfee" type="number" min="0" max="50" value="${ME.cfg.fee}"></label><label class="f">Team cost per hour (USD)<input id="chr" type="number" min="0" step="0.5" value="${ME.cfg.hourly}"></label></div>
   <button class="btn pri" style="margin-top:12px">Save</button></form></div>`;
  const showCode = (name, code) => { $("#pc").innerHTML = `<div class="note" style="margin-top:12px;border-color:var(--y)"><b>Sign-in for ${E(name)}</b><br>Send them this page: <b>businesssanta.com/team</b> and this code:<br><span class="code">${E(code)}</span><br>It will not be shown again.</div>`; };
  $("#pf").onsubmit = e => { e.preventDefault(); act(async () => { const r = await api("person", { name:$("#pn").value, role:$("#pr").value }); const n = $("#pn").value; await peoplePage(); showCode(n, r.code); const me = await api("me"); ME.people = me.people; }); };
  document.querySelectorAll("[data-nc]").forEach(b => b.onclick = () => act(async () => { const r = await api("newCode", { uid:b.dataset.nc }); const p = j.people.find(x => x.id === b.dataset.nc); showCode(p.name, r.code); }));
  document.querySelectorAll("[data-off]").forEach(b => b.onclick = () => act(async () => { await api("personOff", { uid:b.dataset.off }); peoplePage(); }));
  const gl = async ref => { try{ const g = await api("gaccs", null, ref ? "&refresh=1" : ""); $("#gacc").innerHTML = g.accounts.length ? `<table class="t2"><tbody>${g.accounts.map(a => `<tr><td><b>${E(a.email)}</b>${a.primary ? ` <span class="chip y">Main portal account</span>` : ""}</td><td>${a.gsc} Search Console · ${a.ga} Analytics</td><td>${a.drive ? `<span class="chip ok">Drive on</span>` : `<span class="chip warn">Reconnect for Drive</span>`}</td></tr>`).join("")}</tbody></table><p class="sub">Checked ${ago(g.at)}</p>` : `<p class="note">No Google account connected yet.</p>`; }catch(e){ $("#gacc").innerHTML = `<p class="note">${E(e.message)}</p>`; } };
  gl(false); $("#gref").onclick = () => act(() => gl(true), "Asking Google what each account can see…");
  $("#cf").onsubmit = e => { e.preventDefault(); act(async () => { const r = await api("cfg", { fee:$("#cfee").value, hourly:$("#chr").value }); ME.cfg = r.cfg; toast("Saved"); }); };
}
boot();
</script>
