<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Advanced panel · Business Santa client portal</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/portal/portal.css">
<style>
.wrap{max-width:1320px;margin:0 auto;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
@media(max-width:560px){.wrap{padding:14px}}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:760px){.doors{grid-template-columns:minmax(0,1fr)}}
.door{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--panel);transition:border-color .15s}
.door:hover{border-color:var(--y);color:var(--ink)}
.door b{font-size:19px}.door span{color:var(--sub);font-size:14px}.door em{font-style:normal;color:var(--y);font-weight:700;font-size:14px;margin-top:6px}
.tabsB{display:flex;gap:8px;flex-wrap:wrap}
.tabsB button{min-height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--raise);color:var(--sub);font-weight:600;cursor:pointer}
.tabsB button.on{background:var(--y);border-color:var(--y);color:#0b0d14}
.goal{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--soft)}
.goal:last-child{border-bottom:0}
@media(max-width:860px){.goal{grid-template-columns:minmax(0,1fr)}}
.goal .nm b{display:block;color:var(--ink);font-size:15px}.goal .nm span{font-size:12.5px;color:var(--mut)}
.track{position:relative;height:14px;border-radius:99px;background:var(--raise)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--y)}
.track em{position:absolute;top:-5px;width:2px;height:24px;background:var(--sub);border-radius:2px}
.track .pace{background:#5b8def}
.tl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:8px;gap:8px;flex-wrap:wrap}
.num{font-size:22px;font-weight:700;text-align:right;white-space:nowrap}
.num small{display:block;font-size:12px;font-weight:600}
.note2{font-size:13px;color:var(--mut);margin-top:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:12px;height:8px;border-radius:3px;display:inline-block}
.views{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-top:-4px}
.views a{padding:10px 14px;color:var(--sub);text-decoration:none;font-weight:600;font-size:14.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
.views a.on{color:var(--ink);border-bottom-color:var(--y)}
@media(max-width:560px){.views{overflow-x:auto;flex-wrap:nowrap}.views a{white-space:nowrap;padding:10px 11px}}
.srow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--soft)}
.srow:last-child{border-bottom:0}
@media(max-width:860px){.srow{grid-template-columns:minmax(0,1fr)}}
.srow .nm b{display:block;color:var(--ink);font-size:15px}.srow .nm>span{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
.srow .vv{font-size:22px;font-weight:700}.srow .vv small{font-size:12.5px;color:var(--mut);font-weight:600;display:block}
.bar2{height:8px;border-radius:99px;background:var(--raise);margin-top:8px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--y);border-radius:99px}
.spark{width:100%;height:auto;display:block}
.area{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:18px 0 0}
.chs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:860px){.chs{grid-template-columns:minmax(0,1fr)}}
.ch{display:flex;flex-direction:column;gap:10px}
.ch h3{margin:0;font-size:16.5px}.ch dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:0;font-size:14px}
.ch dt{color:var(--mut)}.ch dd{margin:0;color:var(--sub)}
.dt{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--soft)}
.dt:last-child{border-bottom:0}.dt .d{font-weight:700;color:var(--ink)}.dt .d small{display:block;color:var(--mut);font-weight:600;font-size:12px}
.dt b{display:block;color:var(--ink);font-size:14.5px}.dt>div>span:not(.chip){font-size:13px;color:var(--mut);display:block}
@media(max-width:560px){.dt{grid-template-columns:74px minmax(0,1fr)}.dt>:last-child{grid-column:2}}
.filt{display:flex;gap:8px;flex-wrap:wrap}
.filt button{min-height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer}
.filt button.on{border-color:var(--y);color:var(--y)}
@media(max-width:480px){.top .hc{display:none}}
.srow .chip,.dt .chip,.ch .chip{display:inline-flex;width:auto;align-self:flex-start}
.mini{font-size:13px;color:var(--mut)}.mini a{color:var(--sub)}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/portal/hq"><img src="/assets/img/logo-96.webp" alt=""><span><b>Business Santa</b><small>Advanced panel</small></span></a>
  <div class="row" style="gap:8px"><a class="btn sm pri" href="/api/portal-hq?p=cr">Full Control Room</a><a class="btn sm" href="/api/portal-hq?p=cc">Command Center</a><a class="btn sm" href="/portal/admin">Admin console</a><a class="btn sm hc" href="/portal/app">Client view</a></div>
</header>
<main class="wrap" id="main"><div style="display:grid;place-items:center;min-height:40vh"><span class="spin"></span></div></main>
<footer class="pf"><span>Advanced panel · only you can open it</span><span>Powered by SEO Season</span></footer>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const num = n => n == null ? "-" : Number(n).toLocaleString("en-US");
  const fmt = s => s ? new Date(s.length === 10 ? s + "T12:00:00" : s).toLocaleDateString("en-IN", { day:"numeric", month:"short" }) : "";
  const BR = { BS:"Business Santa", MV:"Manu Vishranti" };
  let S = null, brand = "BS";
  try{ brand = localStorage.getItem("bsp.hqBrand") || "BS"; }catch(e){}

  async function load(){
    const [r1, r2, r3] = await Promise.all(["cr", "cc"].map(sp => fetch("/api/ops?a=snapshot&space=" + sp, { credentials:"same-origin" })).concat([fetch("/api/ops?a=beats", { credentials:"same-origin" })]));
    if(r1.status === 401){ location.replace("/portal?team=1"); return; }
    const a = await r1.json(), b = await r2.json(), c = await r3.json().catch(() => ({}));
    const has = a.ok && Object.keys(a.snap.cols).length;
    S = has ? { at:a.at || b.at, cr:a.snap, cc:b.ok ? b.snap : { docs:{}, cols:{} }, beats:c.beats || {} } : null;
    draw(a.ok ? { error:"No task has reported to the portal yet." } : a);
  }
  /* Where the number should be today if it moves in a straight line from its start to the first target. */
  function pace(g, m1){
    if(g.baseline == null || !g.baselineAt || g.t1 == null) return null;
    const a = Date.parse(g.baselineAt), b = Date.parse(m1), now = Date.now();
    if(!(b > a)) return null; const f = Math.max(0, Math.min(1, (now - a) / (b - a)));
    return g.baseline + (g.t1 - g.baseline) * f;
  }
  function goalRow(g, ms){
    const m1 = (ms[0] || {}).at, m2 = (ms[1] || {}).at, live = !!g.live;
    const t1 = g.t1 != null ? g.t1 : null, t2 = g.t2 != null ? g.t2 : null, act = g.actual != null ? g.actual : null;
    const top = Math.max(1, t2 || 0, act || 0, t1 || 0), p = pace(g, m1);
    const pct = v => Math.max(0, Math.min(100, 100 * v / top)).toFixed(1) + "%";
    let st = "";
    if(live) st = `<span class="chip n">Measured live</span>`;
    else if(act == null) st = `<span class="chip n">Waiting for data</span>`;
    else if(t2 != null && act >= t2) st = `<span class="chip ok">Christmas target passed</span>`;
    else if(t1 != null && act >= t1) st = `<span class="chip ok">First target passed</span>`;
    else if(p != null && act >= p) st = `<span class="chip ok">On pace</span>`;
    else if(p != null) st = `<span class="chip bad">Behind pace</span>`;
    return `<div class="goal"><div class="nm"><b>${esc(g.label)}</b><span>${esc(g.source || "")}${g.actualAt ? " · read " + esc(fmt(g.actualAt)) : ""}</span><div style="margin-top:6px">${st}</div></div>
      <div>${live || act == null && g.t1x ? `<div class="note2">${esc(g.note || "This goal is measured live from the channel in the Control Room.")}${g.t1x ? ` Targets: the channel's own average by ${esc(fmt(m1))}, ${Math.round((g.t2x - 1) * 100)}% above it by ${esc(fmt(m2))}.` : ""}</div>` : `
        <div class="track">${act != null ? `<i style="width:${pct(act)}"></i>` : ""}${p != null && act != null ? `<em class="pace" style="left:${pct(p)};background:#5b8def" title="Pace today"></em>` : ""}${t1 != null ? `<em style="left:${pct(t1)}" title="${esc(fmt(m1))} target"></em>` : ""}${t2 != null ? `<em style="left:calc(${pct(t2)} - 2px)" title="${esc(fmt(m2))} target"></em>` : ""}</div>
        <div class="tl"><span>Start ${num(g.baseline)}${g.baselineAt ? " (" + esc(fmt(g.baselineAt)) + ")" : ""}</span>${p != null ? `<span style="color:#8fb0f5">Pace today ${num(Math.round(p))}</span>` : ""}<span>${esc(fmt(m1))}: ${num(t1)}</span><span>${esc(fmt(m2))}: ${num(t2)}</span></div>
        ${g.note ? `<div class="note2">${esc(g.note)}</div>` : ""}`}</div>
      <div class="num">${live ? "-" : num(act)}<small class="mut">now</small></div></div>`;
  }
  const VIEWS = [["overview", "Overview"], ["goals", "Goals and history"], ["channels", "Channels"], ["dates", "Key dates"], ["activity", "Activity"], ["resources", "Usage and limits"]];
  const viewNow = () => { const h = location.hash.slice(1); return VIEWS.some(v => v[0] === h) ? h : "overview"; };
  const isBrand = t => { t = String(t || "").toLowerCase(); return brand === "BS" ? /santa/.test(t) : /vishranti|manu/.test(t); };
  const nOf = v => { if(typeof v === "number") return v; if(typeof v === "string"){ const m = v.replace(/,/g, "").match(/^\s*[$₹]?\s*(-?\d+(\.\d+)?)/); return m ? +m[1] : null; } return null; };
  const today = () => new Date().toLocaleDateString("en-CA", { timeZone:"Asia/Kolkata" });
  const stChip = s => { s = String(s || ""); return /behind|late|fail/i.test(s) ? `<span class="chip bad">${esc(s)}</span>` : /on pace|ahead|on track|passed|reached|done/i.test(s) ? `<span class="chip ok">${esc(s)}</span>` : s ? `<span class="chip n">${esc(s)}</span>` : ""; };
  function sprintOf(){ const c = (S.cc.cols.sprint || []).find(r => isBrand(r.id + " " + (r.data.title || ""))); return c ? c.data : null; }
  function nextT(sp, r){ const ds = sp.targetDates || [], t = today(); let i = ds.findIndex(d => d >= t); if(i < 0) i = ds.length - 1; return { date:ds[i], value:(r.t || [])[i] }; }
  /* A small chart: dashed line is the plan (start to each target date), the solid line is every reading the tasks saved. */
  function spark(sp, r){
    const ds = sp.targetDates || [], tv = (r.t || []).map(nOf), b = nOf(r.b) || 0, start = sp.startDate || ds[0];
    if(!ds.length || !start || tv.some(v => v == null)) return `<div class="mini">No target dates on this goal yet.</div>`;
    const plan = [[start, b]].concat(ds.map((d, i) => [d, tv[i]]));
    const hist = (r.h || []).map(p => [p.d, nOf(p.v)]).filter(p => p[1] != null && p[0]);
    if(r.r && nOf(r.l) != null && !hist.some(p => p[0] === r.r)) hist.push([r.r, nOf(r.l)]);
    hist.sort((a, c) => String(a[0]).localeCompare(String(c[0])));
    const t0 = Date.parse(start), t1 = Date.parse(ds[ds.length - 1]); if(!(t1 > t0)) return "";
    const all = plan.concat(hist).map(p => p[1]), vmax = Math.max(1, ...all), vmin = Math.min(0, ...all);
    const W = 320, H = 92, L = 6, R = 6, T = 8, B = 20;
    const X = d => L + (W - L - R) * Math.max(0, Math.min(1, (Date.parse(d) - t0) / (t1 - t0))), Y = v => T + (H - T - B) * (1 - (v - vmin) / ((vmax - vmin) || 1));
    const path = ps => ps.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
    const nowX = X(new Date().toISOString());
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(r.n)}: plan and readings">
      <line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="#2a2f3d"/>
      <line x1="${nowX.toFixed(1)}" x2="${nowX.toFixed(1)}" y1="${T}" y2="${H - B}" stroke="#5b8def" stroke-dasharray="2 3"/>
      <path d="${path(plan)}" fill="none" stroke="#a0a8b8" stroke-width="1.5" stroke-dasharray="4 4"/>
      ${plan.slice(1).map(p => `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2.6" fill="#a0a8b8"/>`).join("")}
      ${hist.length > 1 ? `<path d="${path(hist)}" fill="none" stroke="#FDB913" stroke-width="2.4" stroke-linejoin="round"/>` : ""}
      ${hist.map(p => `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.2" fill="#FDB913"><title>${esc(fmt(p[0]))}: ${num(p[1])}</title></circle>`).join("")}
      <text x="${L}" y="${H - 5}" font-size="10.5" fill="#a0a8b8">${esc(fmt(start))}</text>
      <text x="${W - R}" y="${H - 5}" font-size="10.5" fill="#a0a8b8" text-anchor="end">${esc(fmt(ds[ds.length - 1]))}</text>
    </svg>`;
  }
  function vGoals(){
    const sp = sprintOf();
    if(!sp) return `<section class="card"><h2>Goals and history</h2><p class="sub" style="margin:0">The ${esc(BR[brand])} sprint has not reached the portal yet. It arrives with the next Portal sync run.</p></section>`;
    const rows = sp.rows || [], areas = [...new Set(rows.map(r => r.a || "Other"))];
    const cnt = re => rows.filter(r => re.test(r.s || "")).length, unread = rows.filter(r => r.l == null || r.l === "").length;
    return `<section class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px"><div><h2 style="margin:0">${esc(sp.title || BR[brand])}</h2>
        <div class="mini">${rows.length} goals · targets on ${esc((sp.targetDates || []).map(fmt).join(", "))}${sp.syncedAt ? " · updated " + esc(fmt(sp.syncedAt)) : ""}</div></div>
        <div class="row" style="gap:6px;flex-wrap:wrap"><span class="chip ok">${cnt(/ahead|on pace|on track|passed|reached/i)} on pace</span><span class="chip bad">${cnt(/behind/i)} behind</span><span class="chip n">${unread} not read yet</span></div></div>
      <div class="legend" style="margin-top:12px"><span><i style="background:#FDB913"></i>Readings</span><span><i style="background:#a0a8b8"></i>Plan to each target</span><span><i style="background:#5b8def"></i>Today</span></div>
      ${areas.map(a => `<div class="area">${esc(a)}</div>` + rows.filter(r => (r.a || "Other") === a).map(r => { const nt = nextT(sp, r), tv = nOf(nt.value), lv = nOf(r.l), bv = nOf(r.b) || 0;
        const pct = tv != null && lv != null ? (tv === bv ? (lv >= tv ? 100 : 0) : Math.max(0, Math.min(100, Math.round(100 * (lv - bv) / (tv - bv))))) : null;
        return `<div class="srow"><div class="nm"><b>${esc(r.n)}</b><span>Start ${esc(r.b)}${r.p ? " · How: " + esc(r.p) : ""}</span><div style="margin-top:6px">${stChip(r.s)}</div></div>
          <div><div class="vv">${lv != null ? num(lv) : esc(r.l || "-")}<small>next target ${esc(nt.value == null ? "-" : num(nOf(nt.value)))} by ${esc(fmt(nt.date))}</small></div>${pct != null ? `<div class="bar2"><i style="width:${pct}%${/behind/i.test(r.s) ? ";background:var(--bad)" : ""}"></i></div>` : ""}</div>
          <div>${spark(sp, r)}</div></div>`; }).join("")).join("")}</section>
      ${(sp.milestones || []).length ? `<section class="card"><h2>Milestones</h2>${sp.milestones.slice().sort((a, c) => String(a.due).localeCompare(String(c.due))).map(m => `<div class="dt"><div class="d">${esc(fmt(m.due))}</div><div><b>${esc(m.name)}</b><span>${esc([m.owner, m.evidence].filter(Boolean).join(" · "))}</span></div><div>${stChip(m.status || (m.due < today() ? "Late" : "Open"))}</div></div>`).join("")}</section>` : ""}`;
  }
  function vChannels(){
    const ch = S.cr.docs["meta/channels"], b = ch && ch.brands && ch.brands[brand];
    if(!b) return `<section class="card"><h2>Channels</h2><p class="sub" style="margin:0">The channel plan for ${esc(BR[brand])} has not reached the portal yet.</p></section>`;
    const kind = c => ({ run:["ok", "Running"], you:["warn", "By hand"], stop:["bad", "Stopped"], cool:["n", "Cooling down"] }[c.kind] || ["n", c.statusLabel || c.kind || ""]);
    const gl = b.goals || [], keys = gl.length ? Object.keys(gl[0]).filter(k => !/^(measure|why)$/.test(k)) : [];
    return `${b.lead ? `<p class="sub" style="margin:0">${esc(b.lead)}${ch.updatedAt ? ` <span class="mut">· plan updated ${esc(fmt(ch.updatedAt))}</span>` : ""}</p>` : ""}
      ${gl.length ? `<section class="card"><h2>Channel goals</h2><div class="tw"><table class="t"><thead><tr><th>Measure</th>${keys.map(k => `<th>${esc(k)}</th>`).join("")}<th>Why</th></tr></thead><tbody>${gl.map(g => `<tr><td><b>${esc(g.measure)}</b></td>${keys.map(k => `<td>${esc(g[k])}</td>`).join("")}<td class="mut">${esc(g.why || "")}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
      <section class="chs">${(b.channels || []).map(c => { const [cl, lb] = kind(c); return `<div class="card ch"><div class="row" style="justify-content:space-between;gap:10px"><h3>${esc(c.name)}</h3><span class="chip ${cl}">${esc(c.statusLabel || lb)}</span></div>
        <dl>${[["Now", c.now], ["Claude does", c.claude], ["You do", c.you], ["Next", c.next], ["Best result", c.best], ["Why", c.why]].filter(x => x[1]).map(x => `<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join("")}</dl></div>`; }).join("")}</section>
      ${(ch.rules || []).length ? `<section class="card"><h2>Rules every channel follows</h2><ul class="list">${ch.rules.map(r => `<li><span class="d y"></span><span class="tx">${esc(r)}</span></li>`).join("")}</ul></section>` : ""}`;
  }
  function vDates(){
    const ch = S.cr.docs["meta/channels"] || {}, sp = sprintOf(), t = today(), out = [];
    (ch.dates || []).forEach(d => { if(d.brand === brand || /both/i.test(d.brand || "")) out.push({ when:d.date, sort:null, what:d.event, means:d.means, tag:/both/i.test(d.brand) ? "Both brands" : "" }); });
    (sp && sp.milestones || []).forEach(m => out.push({ when:fmt(m.due), sort:m.due, what:m.name, means:[m.owner, m.status].filter(Boolean).join(" · "), late:m.due < t && !/done/i.test(m.status || "") }));
    (sp && sp.targetDates || []).forEach((d, i) => out.push({ when:fmt(d), sort:d, what:"Target check " + (i + 1), means:"Every goal is measured against its target for this date" }));
    const gt = S.cr.docs["meta/growthTargets"] || {}; (gt.milestones || []).forEach(m => out.push({ when:fmt(m.at), sort:String(m.at).slice(0, 10), what:m.label || "Growth milestone", means:"Growth target date" }));
    const kd = x => x.sort || (() => { const p = Date.parse(String(x.when).replace(/,.*$/, "") + " " + new Date().getFullYear()); return isNaN(p) ? "9999" : new Date(p).toISOString().slice(0, 10); })();
    out.sort((a, c) => kd(a).localeCompare(kd(c)));
    const up = out.filter(x => kd(x) >= t), past = out.filter(x => kd(x) < t).slice(-6);
    const row = x => `<div class="dt"><div class="d">${esc(x.when)}</div><div><b>${esc(x.what)}</b><span>${esc(x.means || "")}</span></div><div>${x.late ? `<span class="chip bad">Late</span>` : x.tag ? `<span class="chip n">${esc(x.tag)}</span>` : ""}</div></div>`;
    return `<section class="card"><h2>Coming up for ${esc(BR[brand])}</h2>${up.length ? up.map(row).join("") : `<p class="sub" style="margin:0">Nothing dated ahead yet.</p>`}</section>
      ${past.length ? `<section class="card"><h2>Recently passed</h2>${past.map(row).join("")}</section>` : ""}`;
  }
  let actF = "all";
  function vActivity(){
    const h = (S.cr.cols.history || []).map(r => ({ id:r.id, ...r.data }))
      .sort((a, c) => String(c.lastRunAt || c.at || "").localeCompare(String(a.lastRunAt || a.at || ""))).slice(0, 60);
    const ok = x => /^(done|ok|skipped)/i.test(String(x.result || x.status || ""));
    return `<section class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px"><h2 style="margin:0">What the tasks did</h2>
        <div class="filt">${[["all", "All tasks"], ["brand", "Only " + BR[brand]]].map(([k, v]) => `<button type="button" data-f="${k}" class="${actF === k ? "on" : ""}">${esc(v)}</button>`).join("")}</div></div>
      ${h.length ? `<ul class="list" style="margin-top:10px">${h.filter(x => actF === "all" || isBrand(JSON.stringify(x))).map(x => `<li><span class="d ${ok(x) ? "ok" : "bad"}"></span><span class="tx"><b>${esc(x.name || x.task || x.key || x.id)}</b><div class="meta">${esc(String(x.summary || x.result || x.status || "").slice(0, 220))}</div></span><span class="meta" style="white-space:nowrap">${esc(fmt(x.lastRunAt || x.at))}</span></li>`).join("")}</ul>` : `<p class="sub">No run records in the portal yet. They arrive with each Portal sync run.</p>`}</section>`;
  }
  let USE = null, useErr = "";
  function loadUse(){ fetch("/api/portal?a=usage", { credentials:"same-origin" }).then(r => r.json()).then(d => { if(!d.ok) throw new Error(d.error || "not readable"); USE = d; }).catch(e => { useErr = e.message; USE = USE || {}; }).then(() => { if(viewNow() === "resources") draw({}); }); }
  function meterCard(title, used, limit, opts){
    const now = new Date(), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(), day = now.getDate();
    const proj = used != null ? Math.round(used / Math.max(1, opts.daysCounted || day) * dim) : null;
    const pct = used != null && limit ? Math.min(100, 100 * used / limit) : null, ppct = proj != null && limit ? Math.min(100, 100 * proj / limit) : null;
    const ok = proj == null || !limit || (opts.daysCounted != null && opts.daysCounted < 3) ? null : proj <= limit * 0.85 ? "ok" : proj <= limit ? "warn" : "bad";
    const say = ok === "ok" ? "Will last the month" : ok === "warn" ? "Tight: close to the limit by month end" : ok === "bad" ? "Will run out before month end at this pace" : "Not enough data yet";
    return `<section class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px"><h2 style="margin:0">${esc(title)}</h2>${ok ? `<span class="chip ${ok}">${say}</span>` : `<span class="chip n">${say}</span>`}</div>
      <div class="grid g4" style="margin-top:12px">
        <div class="note"><b style="font-size:24px">${num(used)}</b><br>used this month${opts.about ? " (about)" : ""}</div>
        <div class="note"><b style="font-size:24px">${limit ? num(Math.max(0, limit - (used || 0))) : "-"}</b><br>left of ${num(limit)}</div>
        <div class="note"><b style="font-size:24px">${used != null ? num(Math.round(used / Math.max(1, opts.daysCounted || day))) : "-"}</b><br>a day on average</div>
        <div class="note"><b style="font-size:24px">${num(proj)}</b><br>expected by ${esc(new Date(now.getFullYear(), now.getMonth(), dim).toLocaleDateString("en-IN", { day:"numeric", month:"short" }))} at this pace</div>
      </div>
      ${pct != null ? `<div class="track" style="margin-top:14px"><i style="width:${pct.toFixed(1)}%"></i>${ppct != null ? `<em class="pace" style="left:calc(${ppct.toFixed(1)}% - 1px);background:#5b8def" title="Expected by month end"></em>` : ""}</div><div class="tl"><span>Used</span><span style="color:#8fb0f5">Expected by month end</span><span>Limit ${num(limit)}</span></div>` : ""}
      ${opts.note ? `<p class="note2">${opts.note}</p>` : ""}</section>`;
  }
  function plainKV(o){ return Object.entries(o || {}).filter(([k, v]) => v != null && typeof v !== "object").slice(0, 16); }
  function vResources(){
    if(!USE){ loadUse(); return `<section class="card"><span class="spin"></span></section>`; }
    const s = USE.serpapi || {}, p = USE.portalSearches || {}, st = USE.storage || {};
    const dayKeys = Object.keys(st).filter(k => /^d\d\d$/.test(k)), serpOther = s.used != null ? Math.max(0, s.used - (p.total || 0)) : null;
    const eco = S.cr.docs["meta/economy"], plan = S.cr.docs["meta/planusage"];
    return `${useErr ? `<p class="err">Usage could not be read just now: ${esc(useErr)}</p>` : ""}
      ${meterCard("Google searches (SerpAPI)", s.used != null ? s.used : null, s.perMonth || null, { note:`${s.plan ? "Plan: " + esc(s.plan) + ". " : ""}The portal used ${num(p.total || 0)} this month (live previews ${num(p.preview || 0)}, check now ${num(p.admin || 0)}, weekly checks ${num(p.weekly || 0)})${serpOther != null ? `; ${num(serpOther)} came from other work on the same account` : ""}. Each Google Maps check uses 2 searches; below ${num(USE.floor)} left, checks skip Maps on their own. The expected figure assumes the plan resets with the calendar month.${s.error ? " Account not readable: " + esc(s.error) : ""}` })}
      ${meterCard("Portal storage (Upstash)", st.total != null ? st.total : null, USE.storageLimit || 500000, { about:true, daysCounted:dayKeys.length || null, note:`Free plan: 500,000 commands a month. Counted by the portal itself since ${dayKeys.length ? esc(fmt(USE.month + "-" + dayKeys.sort()[0].slice(1))) : "today"}, so the first month reads low. Opening this panel costs a few dozen commands; each Portal sync run costs about one per record it sends.` })}
      ${eco || plan ? `<section class="card"><h2>Claude and task budget</h2><p class="mini" style="margin:0 0 10px">As reported by the scheduled tasks in the Control Room.</p><div class="tw"><table class="t"><tbody>${plainKV(eco).concat(plainKV(plan)).map(([k, v]) => `<tr><td class="mut">${esc(k.replace(/([A-Z])/g, " $1").replace(/^./, c => c.toUpperCase()))}</td><td><b>${esc(typeof v === "number" ? num(v) : v)}</b></td></tr>`).join("")}</tbody></table></div></section>` : `<section class="card"><h2>Claude and task budget</h2><p class="sub" style="margin:0">Arrives with the Portal sync task (the Control Room's economy and plan usage records).</p></section>`}
      <section class="card"><h2>Free services</h2><ul class="list"><li><span class="d ok"></span><span class="tx"><b>Google PageSpeed</b><div class="meta">Speed tests in every check. Free with the key, with a large daily allowance; nothing to pay or watch.</div></span></li><li><span class="d ok"></span><span class="tx"><b>Vercel hosting</b><div class="meta">Free plan: 100 deployments a day across both sites. Changes are bundled into one push per work block to stay well under it.</div></span></li></ul></section>`;
  }
  function draw(j){
    const m = $("main");
    if(!S){ m.innerHTML = `<section><div class="lbl">Advanced panel</div><h1>Your brands, strategy and every step</h1></section><div class="card"><h2>The first snapshot has not arrived yet</h2><p class="sub">${esc((j && j.error) || "")}</p><p class="sub" style="margin:0">This page fills in as the Portal sync task reports.</p></div>`; return; }
    const v = viewNow(), at = new Date(S.at).toLocaleString("en-IN", { timeZone:"Asia/Kolkata", day:"numeric", month:"short", hour:"numeric", minute:"2-digit" });
    const body = v === "goals" ? vGoals() : v === "channels" ? vChannels() : v === "dates" ? vDates() : v === "activity" ? vActivity() : v === "resources" ? vResources() : vOverview();
    m.innerHTML = `
      <section class="row" style="justify-content:space-between;flex-wrap:wrap;align-items:flex-end"><div><div class="lbl">Advanced panel · data as of ${esc(at)} IST</div><h1>Your brands, strategy and every step</h1></div>
        <div class="tabsB" role="tablist">${Object.entries(BR).map(([k, x]) => `<button type="button" data-b="${k}" class="${k === brand ? "on" : ""}" aria-selected="${k === brand}">${x}</button>`).join("")}</div></section>
      <nav class="views">${VIEWS.map(([k, x]) => `<a href="#${k}" class="${k === v ? "on" : ""}">${x}</a>`).join("")}</nav>
      ${body}`;
    m.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { brand = b.dataset.b; try{ localStorage.setItem("bsp.hqBrand", brand); }catch(e){} draw(j); });
    m.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { actF = b.dataset.f; draw(j); });
  }
  window.addEventListener("hashchange", () => { draw({}); window.scrollTo(0, 0); });
  function vOverview(){
    const cr = S.cr || { docs:{}, cols:{} }, gt = cr.docs["meta/growthTargets"] || {}, ms = gt.milestones || [];
    const goals = (gt.goals || []).filter(g => g.brand === brand);
    const open = (cr.cols.handoff || []).reduce((n, h) => n + ((h.data.items || []).filter(i => !i.done && String(i.brand || i.project || "").toUpperCase().includes(brand === "BS" ? "SANTA" : "VISHRANTI")).length), 0);
    const wins = (cr.cols.wins || []).filter(w => isBrand(JSON.stringify(w.data))).slice(0, 6);
    const behind = goals.filter(g => { const p = pace(g, (ms[0] || {}).at); return !g.live && g.actual != null && p != null && g.actual < p && !(g.t1 != null && g.actual >= g.t1); }).length;
    const nx = ms.find(x => Date.parse(x.at) > Date.now());
    return `
      <section class="grid g4">
        <a class="card kpi" href="#goals" style="text-decoration:none;color:inherit"><div class="lbl">Goals tracked</div><div style="font-size:30px;font-weight:700">${goals.length}</div><div class="mut" style="font-size:13.5px">${behind ? behind + " behind pace" : "none behind pace"}</div></a>
        <a class="card kpi" href="#dates" style="text-decoration:none;color:inherit"><div class="lbl">Next milestone</div><div style="font-size:30px;font-weight:700">${esc(fmt((nx || ms[ms.length - 1] || {}).at)) || "-"}</div><div class="mut" style="font-size:13.5px">${esc((nx || {}).label || "")}</div></a>
        <div class="card kpi"><div class="lbl">Waiting for you</div><div style="font-size:30px;font-weight:700">${open}</div><div class="mut" style="font-size:13.5px">to-do items for ${esc(BR[brand])}</div></div>
        <a class="card kpi" href="#activity" style="text-decoration:none;color:inherit"><div class="lbl">Recent wins</div><div style="font-size:30px;font-weight:700">${wins.length}</div><div class="mut" style="font-size:13.5px">in the latest snapshot</div></a>
      </section>
      <section class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><h2 style="margin:0">${esc(BR[brand])} growth targets</h2>
        <div class="legend"><span><i style="background:var(--y)"></i>Now</span><span><i style="background:#5b8def"></i>Pace today</span><span><i style="background:var(--sub)"></i>Targets</span></div></div>
        ${goals.length ? goals.map(g => goalRow(g, ms)).join("") : `<p class="sub">No growth targets for this brand in the snapshot.</p>`}
        <p class="mini" style="margin:10px 0 0">Every goal with its history chart is under <a href="#goals">Goals and history</a>.</p></section>
      ${wins.length ? `<section class="card"><h2>Recent wins</h2><ul class="list">${wins.map(w => `<li><span class="d ok"></span><span class="tx"><b>${esc(w.data.title || w.data.what || w.data.text || w.id)}</b>${w.data.detail || w.data.why ? `<div class="meta">${esc(w.data.detail || w.data.why)}</div>` : ""}</span><span class="meta" style="white-space:nowrap">${esc(fmt(w.data.at))}</span></li>`).join("")}</ul></section>` : ""}
      ${beatsCard()}
      <p class="mini" style="margin:0">Need the full original pages? <a href="/portal/hq/control-room">Control Room copy</a> · <a href="/portal/hq/command-center">Command Center copy</a> (read only).</p>`;
  }
  function beatsCard(){
    const B = Object.entries(S.beats || {}).sort((a, b) => String(b[1].at).localeCompare(String(a[1].at)));
    if(!B.length) return "";
    const age = t => { const h = (Date.now() - Date.parse(t)) / 36e5; return h < 1 ? Math.max(1, Math.round(h * 60)) + " min ago" : h < 48 ? Math.round(h) + " h ago" : Math.round(h / 24) + " days ago"; };
    return `<section class="card"><h2>Tasks reporting to the portal</h2><div class="tw"><table class="t"><thead><tr><th>Task</th><th>Last report</th><th>Result</th></tr></thead><tbody>${B.map(([k, v]) => `<tr><td>${esc(v.name || k)}</td><td>${esc(age(v.at))}</td><td>${/^(Done|Skipped)/.test(v.result) ? `<span class="chip ok">${esc(v.result.slice(0, 60))}</span>` : `<span class="chip bad">${esc(v.result.slice(0, 60))}</span>`}</td></tr>`).join("")}</tbody></table></div></section>`;
  }
  load().catch(e => { $("main").innerHTML = `<div class="card"><h2>The panel did not open</h2><p class="sub">${esc(e.message)}</p></div>`; });
})();
</script>
</body>
</html>
