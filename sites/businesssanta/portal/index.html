<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Client portal · Business Santa</title>
<link rel="icon" href="/favicon.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#0b0d14;color:#f7f7f9;font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif}
a{color:#FDB913}main{flex:1;display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:440px;background:#151823;border:1px solid #2a2f3d;border-radius:16px;padding:28px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.brand img{width:44px;height:44px;border-radius:50%}.brand b{font-size:19px;display:block}.brand small{color:#a0a8b8}
h1{font-size:24px;margin:0 0 8px}p{color:#ccd2dd;margin:0 0 16px}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:11px;font-weight:700;text-decoration:none;background:#FDB913;color:#0b0d14}
.btn.g{background:#1c202d;color:#f7f7f9;border:1px solid #2a2f3d;margin-top:10px;font-weight:600}
footer{text-align:center;color:#a0a8b8;font-size:13px;padding:18px}
</style>
</head>
<body>
<main><div class="card">
  <div class="brand"><img src="/assets/img/logo-96.webp" alt=""><span><b>Business Santa</b><small>Client portal</small></span></div>
  <h1>Your business, in one place</h1>
  <p>Clients sign in with the private link their Business Santa advisor sends them. Client sign-in opens with your first month.</p>
  <a class="btn" href="/portal/demo">See a live preview of your business</a>
  <a class="btn g" href="mailto:seo@businesssanta.com?subject=Client%20portal%20access">Ask for your sign-in link</a>
</div></main>
<footer>Powered by SEO Season</footer>
</body>
</html>
